name: guard-24-7-heartbeat

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: latido (cadena de hashes anti-tamper)
        run: |
          mkdir -p state
          git fetch origin heartbeat 2>/dev/null || true
          git show origin/heartbeat:state/heartbeat.jsonl > state/heartbeat.jsonl 2>/dev/null || true
          python3 guard24_7/cli.py cloud-heartbeat --state-dir state
      - name: publicar solo la cadena en la rama heartbeat
        run: |
          git config user.name "guard-24-7"
          git config user.email "guard-24-7@users.noreply.github.com"
          git checkout --orphan heartbeat-publish
          git rm -rf . --quiet || true
          mkdir -p state
          git add state/heartbeat.jsonl
          git commit -m "heartbeat $(date -u +%Y%m%dT%H%M%SZ)" || { echo "sin cambios"; exit 0; }
          git push origin HEAD:heartbeat --force
